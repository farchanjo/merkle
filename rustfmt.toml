# rustfmt workspace configuration for Merkle
# Edition 2024; nightly-only options require `rustfmt --edition 2024`.
edition = "2024"

# Line width: 100 chars is a practical limit for review on standard monitors.
max_width = 100
hard_tabs  = false
tab_spaces = 4

reorder_imports     = true

# Shorten struct-literal initialisation: `foo: foo` → `foo`.
use_field_init_shorthand = true

# Enforce Unix line endings in all sources regardless of OS.
newline_style = "Unix"
