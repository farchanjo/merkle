[package]
name         = "merkle-adapter-mcp"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
description  = "Driving-port adapter: rmcp SDK MCP server. Translates MCP stdio tool calls into JSON-RPC messages forwarded to the Vault Agent Companion Socket. Exposes vault.list, vault.describe, vault.use, vault.reveal, vault.put, vault.rotate, vault.delete, vault.bind, and all Proxy Tool entrypoints."

[lints]
workspace = true

[dependencies]
merkle-types                   = { workspace = true }
merkle-companion-client        = { workspace = true }
rmcp                           = { workspace = true }
tokio                          = { workspace = true }
anyhow                         = { workspace = true }
base64                         = { workspace = true }
blake3                         = { workspace = true }
serde                          = { workspace = true }
serde_json                     = { workspace = true }
tracing                        = { workspace = true }
thiserror                      = { workspace = true }
uuid                           = { workspace = true }

[dev-dependencies]
tokio                        = { workspace = true, features = ["macros", "rt-multi-thread"] }
