StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Merkle

Packages = write-good

[*.md]
BasedOnStyles = Vale, write-good, Merkle

# Vale.Terms fires on every casing variant found in the vocabulary, creating
# false positives for technical terms that legitimately appear in different
# casings (e.g., "vault" as a command token vs "Vault" as a proper noun,
# "BLAKE3" as an algorithm name vs "blake3" as a Rust crate name). Casing
# enforcement for unambiguous proper nouns is handled by Merkle.Capitalization.
Vale.Terms = NO

# write-good.ThereIs fires on valid technical prose ("There is a maximum...",
# "There are N entries...") and produces errors on existing content.
# Downgrade to warning so it surfaces as style feedback without blocking.
write-good.ThereIs = warning

# write-good.So is defined at level: error and would survive MinAlertLevel = error.
# Technical prose legitimately starts sentences with "So" in summaries and
# transitions. Downgrade to warning to keep it advisory-only.
write-good.So = warning
