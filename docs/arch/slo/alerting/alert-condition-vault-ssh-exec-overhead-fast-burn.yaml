---
apiVersion: openslo/v1
kind: AlertCondition
metadata:
  name: vault-ssh-exec-overhead-fast-burn
  displayName: vault.ssh.exec Overhead Fast-Burn (14.4x in 1h)
  labels:
    boundedContext: accessMediation
spec:
  description: >
    Fires when the vault.ssh.exec agent-overhead slow-request fraction exceeds
    14.4x the allowed error rate over a rolling 1-hour window. The 30-day
    budget allows at most 5% slow requests (agent overhead exceeding 50 ms).
    A 14.4x burn rate over 1 hour consumes approximately 2% of the monthly
    budget and signals a sustained latency regression in the in-agent path
    (credential resolution, policy check, Audit Entry write, or SSH Bridge
    dispatch) requiring immediate attention. Refer to runbook scenario 17
    (MCP Latency Regression) for response procedure.
  severity: warning
  condition:
    kind: burnrate
    threshold: 14.4
    lookbackWindow: 1h
    alertAfter: 5m
