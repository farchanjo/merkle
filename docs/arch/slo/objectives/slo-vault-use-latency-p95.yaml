---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: slo-vault-use-latency-p95
  displayName: vault.use p95 Latency < 100 ms
  labels:
    boundedContext: accessMediation
spec:
  description: >
    No more than 5% of vault.use calls may exceed 100 ms at the p95 percentile
    in any 30-day rolling window. The measured path covers UseToken issuance
    and the Audit Entry write; OOB Confirmation wait time is subtracted from
    the measurement window. A rolling 1-hour window exceeding 10% slow requests
    constitutes a fast-burn alert condition.
  service: mcp-adapter
  indicator:
    metadataRef: vault-use-latency-p95
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "95% of vault.use requests complete within 100 ms"
      op: gte
      target: 0.95
