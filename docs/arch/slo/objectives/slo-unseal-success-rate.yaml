---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: slo-unseal-success-rate
  displayName: Unseal Success Rate 99.9%
  labels:
    boundedContext: identityAndSealing
spec:
  description: >
    At least 99.9% of Unseal Protocol completions must succeed over a 30-day
    rolling window, counted only when the OS Keychain entry or a passphrase is
    present and accessible. Failures due to missing or revoked keychain entries
    are excluded from the denominator. Assuming approximately 2 unseals per day,
    the 0.1% budget allows 1 tolerated failure per month. A second failure in
    the same calendar month triggers root cause analysis. The measurement source
    is merkle_unseal_total labeled by outcome and reason.
  service: vault-agent
  indicator:
    metadataRef: unseal-success-rate
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.9% of unseals succeed (keychain/passphrase present)"
      op: gte
      target: 0.999
