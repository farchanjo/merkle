---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: slo-vault-audit-query-availability
  displayName: vault.audit.query Availability 99.5%
  labels:
    boundedContext: accessMediation
spec:
  description: >
    At least 99.5% of vault.audit.query MCP tool calls must succeed (non-error
    JSON-RPC result) over a 30-day rolling window. vault.audit.query provides
    LLM-driven audit review within Claude Code sessions; its availability SLO
    is intentionally lower than the core vault operations (99.5% vs 99.9%)
    because audit review is a secondary observability capability and not on the
    critical path for Secret management. Any sustained availability degradation
    that would exhaust the budget triggers investigation. The metric source is
    merkle_rpc_requests_total and merkle_rpc_errors_total filtered by
    op="vault.audit.query".
  service: mcp-adapter
  indicator:
    metadataRef: vault-audit-query-availability
  timeWindow:
    - duration: 30d
      isRolling: true
  budgetingMethod: Occurrences
  objectives:
    - displayName: "99.5% of vault.audit.query calls succeed"
      op: gte
      target: 0.995
