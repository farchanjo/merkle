---
apiVersion: openslo/v1
kind: SLI
metadata:
  name: durability-invariants-ok
  displayName: WAL Durability Invariants Passing
  labels:
    boundedContext: secretStorage
spec:
  description: >
    Gauge-based availability indicator reflecting whether all WAL durability
    invariants are currently passing. A value of 1 indicates that the most
    recent merkle doctor --durability audit confirmed all invariants: clean WAL
    checkpoint on graceful shutdown, fsync policy bounding crash loss to at most
    10 mutations since the last checkpoint. A value of 0 indicates at least one
    invariant has failed. The metric source is merkle_durability_invariants_ok
    emitted by merkle doctor --durability audits. Used by both
    slo-durability-graceful and slo-durability-crash objectives.
  ratioMetric:
    counter: false
    good:
      metricSource:
        type: Prometheus
        metricSourceRef: local-metrics
        spec:
          query: >
            merkle_durability_invariants_ok
    total:
      metricSource:
        type: Prometheus
        metricSourceRef: local-metrics
        spec:
          query: >
            clamp_max(merkle_durability_invariants_ok * 0 + 1, 1)
