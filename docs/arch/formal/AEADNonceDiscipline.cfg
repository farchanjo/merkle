\* AEADNonceDiscipline — bounds: MaxOps=2 MaxRotations=1 PoolSize=2
\* State space: ~9,546 states generated / 4,890 distinct, depth <10, completes in <1s
\* TLC model-checker configuration for AEADNonceDiscipline.tla (Wave-3 polish)
\*
\* -----------------------------------------------------------------------
\* Structural abstraction (documented here per audit requirements):
\*   Encrypt(content, dek, nonce, ad) is modeled as a perfect injection on
\*   (dek_version, nonce, handle) — no two distinct tuples produce the same
\*   ciphertext.  This discharges XChaCha20-Poly1305 IND-CPA + INT-CTXT as
\*   a model-level axiom accepted out-of-band.
\*   Hash and Hmac: see AuditHashChain.cfg for the shared abstraction note.
\* -----------------------------------------------------------------------
\*
\* CHECK_DEADLOCK FALSE rationale:
\*   Intended terminal states (not errors):
\*     (a) Nonce pool exhausted for current DEK: AlreadyIssuedForDek(dek)
\*         covers 1..PoolSize (including aborted nonces), IssueNonce has no
\*         available nonce, no rotation remains.  This is the pool-exhaustion
\*         path introduced in Wave-3 (finding C): with MaxOps=PoolSize=2,
\*         both nonces are consumed or aborted within one DEK cycle.
\*     (b) All op_ids in issuedNonces or encryptOps for the current DEK:
\*         IssueNonce disabled.  Model-boundary terminal.
\*     (c) MaxRotations reached + (a) or (b): RotateDEK disabled.
\*   In all cases Next has no enabled action; this is by design.
\*   The pool-exhaustion path (a) is exercised because MaxOps=PoolSize=2.
\*
\* Wave-3 CHECK_DEADLOCK investigation note:
\*   We experimented with CHECK_DEADLOCK TRUE and MaxOps=PoolSize in {3,4,5}.
\*   At MaxOps>=3, the abortedNonces variable (a new monotone subset introduced
\*   in Wave-3) causes the reachable state space to grow at >5M states/minute,
\*   exceeding the 5-minute model-check budget.  MaxOps=2 with PoolSize=2 gives
\*   9,546 states in <1 second and fully exercises all invariants including the
\*   pool-exhaustion branch.  With CHECK_DEADLOCK TRUE the terminal state is
\*   reported as a deadlock (by design), but since it is an ACCEPTABLE terminal
\*   state, CHECK_DEADLOCK FALSE is the correct TLC setting — consistent with
\*   the W1 rationale.
\*
\* SYMMETRY note:
\*   TLC SYMMETRY requires a CONSTANT declared as a model-value set.
\*   OpIds = 1..MaxOps is not a model-value set and cannot be used as a
\*   symmetry set directly.  Symmetry reduction is omitted; state-space
\*   remains tractable at the chosen bounds.
\*
\* Bounds (Wave-3 — MaxOps reduced from W1=3 to 2; PoolSize reduced from W1=4):
\*   MaxOps       = 2   reduced from W1=3 to keep state space tractable after
\*                      adding the abortedNonces subset variable (Wave-3 F).
\*                      PoolSize=MaxOps=2 ensures exact pool exhaustion.
\*   MaxRotations = 1   exercises the RotateAtomicity path exactly once
\*   PoolSize     = 2   equals MaxOps; forces exact pool exhaustion: with 2 ops
\*                      and 2 nonces (aborted nonces excluded from re-use via
\*                      AlreadyIssuedForDek), the pool is fully consumed within
\*                      one DEK cycle.  W1 had PoolSize=4 > MaxOps=3 (slack)
\*                      and never reached the exhaustion terminal state.
\*
\* Note on W1 bounds (MaxOps=3, PoolSize=4) with Wave-3 additions:
\*   The new abortedNonces subset variable (Wave-3 finding F) adds a monotone
\*   set whose powerset is explored independently of issuedNonces and
\*   issuanceHistory.  At MaxOps=3 this causes an ~250x state-space expansion
\*   vs W1.  MaxOps=2 isolates the pool-exhaustion semantics cleanly at
\*   negligible cost (4890 distinct states, finished in <1 second).
\*
\* State-space estimate (Wave-3):
\*   issuedNonces subsets x encryptOps subsets x issuanceHistory subsets
\*   x abortedNonces subsets x dek in {1,2} x rotations in {0,1}
\*   Actual: 9,546 states generated, 4,890 distinct states found.
\*   TLC runtime: <1 s on a modern laptop (M-series / recent x86_64).

CONSTANT
  MaxOps       = 2
  MaxRotations = 1
  PoolSize     = 2

SPECIFICATION
  Spec

CHECK_DEADLOCK FALSE

INVARIANT
  TypeOK
  NonceUniquenessPerDEK
  NoPendingNonceSharedWithCompleted
  ADBinding
  IssuanceProvenance
  RotateAtomicity
  AbortedNeverReused
  NoPendingOldDekNonce

PROPERTY
  NonceUniquenessAlways
