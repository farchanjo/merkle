\* AuditHashChain — bounds: MaxEntries=5 MaxActors=2 MaxTampers=2
\* State space: ~700k generated / 322k distinct, depth 17, completes in ~11s
\* TLC model-checker configuration for AuditHashChain.tla (Wave-3 polish)
\*
\* -----------------------------------------------------------------------
\* Structural abstraction (documented here per audit requirements):
\*   Hash and Hmac are modeled as structural record constructors, NOT
\*   cryptographic primitives.  Every distinct input yields a distinct
\*   output by record-equality — this discharges BLAKE3's 2^-128
\*   second-preimage probability as a model-level axiom.  No collision
\*   is representable in the finite state space TLC explores.
\*   GENESIS_HASH is a record sentinel (type-uniform with all hashes)
\*   to avoid mixed-type equality errors in TLC.
\* -----------------------------------------------------------------------
\*
\* CHECK_DEADLOCK FALSE rationale:
\*   Intended terminal states (not errors):
\*     (a) chain has reached MaxEntries and tampered = MaxTampers;
\*         all adversarial actions exhausted — "fully exercised" state.
\*     (b) chain is full and verified; no more Append or Tamper actions
\*         are enabled.
\*   In both cases Next has no enabled action; this is by design.
\*   Reporting these as deadlocks would be a false positive.
\*
\* SYMMETRY note:
\*   TLC SYMMETRY requires a CONSTANT declared as a model-value set (e.g.,
\*   {a1, a2, a3}).  MaxActors is an integer-bound constant, so Actors =
\*   1..MaxActors is not a model-value set and cannot be used as a symmetry
\*   set directly.  Symmetry reduction is therefore omitted here; state-space
\*   remains tractable at the chosen bounds.
\*
\* Bounds (Wave-3 — MaxEntries increased from W1=4 to 5; MaxTampers kept at 2):
\*   MaxEntries = 5   one extra entry vs W1; exercises TruncateChain(k) at
\*                    more cut points and forces NoChainFork to cover longer
\*                    sequences; MaxEntries=6 at MaxTampers=3 produced >12M
\*                    states (>8 min) — rejected as exceeding the budget
\*   MaxActors  = 2   two concurrent actors; sufficient to distinguish content
\*   MaxTampers = 2   same as W1; increasing to 3 at MaxEntries=6 produced
\*                    exponential blowup; MaxTampers=2 with MaxEntries=5
\*                    is the correct trade-off for the 5-minute budget
\*
\* State-space (Wave-3, actual measurement at MaxEntries=5 MaxTampers=2):
\*   700,423 states generated, 322,453 distinct states found.
\*   Depth 17.  Temporal property checks: 2s at 213K states, 3s at 322K states.
\*   TLC runtime: 11 s (vs W1 baseline <10 s at MaxEntries=4, MaxTampers=2).

CONSTANT
  MaxEntries = 5
  MaxActors  = 2
  MaxTampers = 2

SPECIFICATION
  Spec

CHECK_DEADLOCK FALSE

INVARIANT
  TypeOK
  LinkIntegrity
  TimestampMonotone
  TruncationDetectable
  HmacBindsHead
  NoChainFork

ACTION_CONSTRAINT
  AppendOnlyTransitionAction

PROPERTY
  VerifyAfterTamperFails
