[package]
name         = "merkle-mcp"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Merkle MCP Adapter binary: thin stdio MCP server. One process per Claude Code window. Connects to the Vault Agent via the Companion Socket (Unix domain socket); never touches keys, storage, or domain logic directly. Per ADR-0002 + ADR-0024."

[[bin]]
name = "merkle-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
merkle-companion-client = { workspace = true }
merkle-adapter-mcp      = { workspace = true }
rmcp                    = { workspace = true, features = ["transport-io"] }
tokio                   = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-util              = { workspace = true }
anyhow                  = { workspace = true }
clap                    = { workspace = true }
tracing                 = { workspace = true }
tracing-subscriber      = { workspace = true, features = ["env-filter", "fmt", "json"] }
