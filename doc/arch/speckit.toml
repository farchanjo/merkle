[project]
org = "fapp"
codeRoot = "crates"

[git]
email = "farchanjo@gmail.com"

[guard]
mode = "enforce"
specScopeGlobs = []

# Waivers for brownfield CUE corpus under Object Calisthenics / path heuristics
# (warnings only; errors remain blocking). Review: 2027-01-01.

[[validate.waivers]]
rule = "calisthenics.wrap-primitives"
path = "doc/arch/schemas/**"
reason = "Brownfield CUE encodes constrained primitives as type aliases; full VO wrappers would explode schema count without changing runtime contracts."
review_by = "2027-07-01"

[[validate.waivers]]
rule = "calisthenics.small-entities"
path = "doc/arch/schemas/**"
reason = "Aggregate DTOs mirror OpenAPI/domain records; splitting would desync from companion-socket.yaml without product value."
review_by = "2027-07-01"

[[validate.waivers]]
rule = "calisthenics.first-class-collection"
path = "doc/arch/schemas/**"
reason = "Collection fields are intentional on AggregateRoots matching persisted rows and OpenAPI objects."
review_by = "2027-07-01"

[[validate.waivers]]
rule = "calisthenics.no-abbreviation"
path = "doc/arch/schemas/**"
reason = "Abbreviations (op, ts, seq) are closed vocabulary aligned with AuditOp wire names and SQLite columns."
review_by = "2027-07-01"

[[validate.waivers]]
rule = "calisthenics.one-definition-per-file"
path = "doc/arch/schemas/**"
reason = "Related value objects share packages for CUE unification; one-def-per-file is aspirational for greenfield only."
review_by = "2027-07-01"

[[validate.waivers]]
rule = "ddd-tactical.entity-identity"
path = "doc/arch/schemas/**"
reason = "Some entities use Handle URI or composite keys rather than bare id fields; identity is defined in domain docs."
review_by = "2027-07-01"

[[validate.waivers]]
rule = "hexagonal.layers.untagged"
path = "doc/arch/architecture/**"
reason = "Structurizr workspace uses existing C4 tags; full hexagonal layer tags are tracked as follow-up without blocking validation."
review_by = "2027-07-01"

[[validate.waivers]]
rule = "llm-context.path-ref.broken"
path = "CLAUDE.md"
reason = "Project instructions intentionally document XDG paths, LaunchAgent labels, env vars, and install locations outside the git tree."
review_by = "2027-07-01"
