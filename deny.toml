# cargo-deny configuration for Merkle
# Security-sensitive project: crypto, AEAD, secrets, OOB pairing.
# Deny policy is intentionally strict.

# ---------------------------------------------------------------------------
# [graph] — dependency graph settings
# ---------------------------------------------------------------------------
[graph]
# Resolve features for all targets in the workspace. This catches platform-
# specific deps that would otherwise be invisible on the dev machine.
all-features = false
no-default-features = false

# ---------------------------------------------------------------------------
# [licenses]
# ---------------------------------------------------------------------------
[licenses]
# Only permissive, OSI-approved licenses are allowed. GPL/AGPL are denied
# because Merkle is distributed as a standalone binary and copyleft
# contamination would constrain future dual-licensing options.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-roots ships the Mozilla CA trust store as data under CDLA-Permissive-2.0
    # (Community Data License Agreement – Permissive). Permissive, no copyleft.
    "CDLA-Permissive-2.0",
]

# NOTE: the explicit `deny` list was removed in cargo-deny >= 0.16 (PR #611):
# any license NOT present in `allow` above is now denied implicitly. The old
# copyleft list (GPL-2.0/3.0, LGPL-*, AGPL-3.0, EUPL-*, SSPL-1.0) is therefore
# already rejected by virtue of being absent from `allow`, so keeping an
# explicit deny array is both redundant and a hard schema error.

# Minimum confidence for license inference (SPDX expression parser).
# 0.93 is above the default 0.8 to reduce false-positive license approvals
# for crates with non-standard license text placement.
confidence-threshold = 0.93

# Exceptions for specific crates where the license expression is ambiguous
# or the crate ships dual-licensed headers that confuse the scanner.
# Add entries here only after manual review of the crate's LICENSE file.
exceptions = []

# ---------------------------------------------------------------------------
# [bans]
# ---------------------------------------------------------------------------
[bans]
# Surface multiple versions of a crate as a WARNING, not a hard failure.
# The dependency graph carries unavoidable mid-migration duplicates
# (thiserror 1↔2, syn 1 via proc-macro-error, rand/getrandom, secrecy, base64
# via age 0.10 vs the hyper/axum stack). These are bloat/hygiene signals, not
# security defects — vulnerabilities and licenses are still enforced at `deny`
# level under [advisories]/[licenses]. Tighten back to "deny" once the tree is
# de-duplicated (notably the age 0.10 -> 0.11 bump).
multiple-versions = "warn"

# Specific crates that must not appear in the graph.
deny = [
    # openssl-sys: Merkle uses rustls for TLS. Any transitive pull of
    # openssl-sys indicates a misconfigured dependency that would require
    # dynamic linking against the system OpenSSL and break the hermetic binary.
    { name = "openssl-sys", reason = "Use rustls; openssl-sys breaks hermetic static builds" },
    # openssl: same reasoning as openssl-sys.
    { name = "openssl",     reason = "Use rustls; dynamic OpenSSL breaks hermetic static builds" },
    # git2: libgit2 requires libssl; use gitoxide (gix) if git ops are needed.
    { name = "git2",        reason = "libgit2 pulls openssl-sys; use gitoxide (gix) instead" },
]

# Skip multiple-version checks for specific crates where ecosystem fragmentation
# is unavoidable and upgrading is blocked by upstream constraints.
skip = [
    # windows-sys ships multiple minor versions that coexist peacefully and
    # cannot be unified until all Windows crates converge on the same major.
    { name = "windows-sys",  reason = "Ecosystem fragmentation; safe to allow multiple minor versions" },
    { name = "windows_aarch64_gnullvm", reason = "Platform target crate; multiple versions safe" },
    { name = "windows_aarch64_msvc",    reason = "Platform target crate; multiple versions safe" },
    { name = "windows_i686_gnullvm",    reason = "Platform target crate; multiple versions safe" },
    { name = "windows_i686_msvc",       reason = "Platform target crate; multiple versions safe" },
    { name = "windows_x86_64_gnullvm",  reason = "Platform target crate; multiple versions safe" },
    { name = "windows_x86_64_msvc",     reason = "Platform target crate; multiple versions safe" },
    # base64 0.21 (via age 0.10 / config) coexists with 0.22 (via axum / hyper-util).
    # Pure leaf encoder, no shared state — safe to duplicate. Unifies once age is
    # bumped 0.10 -> 0.11 (a breaking change tracked separately from this audit).
    { name = "base64",       reason = "age 0.10 pins 0.21; hyper/axum stack uses 0.22; leaf crate, safe" },
]

# ---------------------------------------------------------------------------
# [advisories]
# ---------------------------------------------------------------------------
[advisories]
# Advisory policy (cargo-deny >= 0.16 schema). Vulnerabilities and security
# notices are ALWAYS denied now — the legacy `vulnerability` / `notice` string
# keys were removed in PR #611 and are hard schema errors if present, which is
# what silently disabled the whole advisory gate (GAP-008).
#
# `unmaintained` takes a scope selector (all | workspace | transitive | none);
# "workspace" surfaces unmaintained advisories for crates the workspace depends
# on directly. `yanked` remains a hard deny.
unmaintained  = "workspace"
yanked        = "deny"

# No vulnerabilities are ignored.  A known advisory must remain a release
# blocker unless it is removed from the resolved graph or a narrowly scoped,
# time-bounded exception is justified for test-only code.
ignore = []

# ---------------------------------------------------------------------------
# [sources]
# ---------------------------------------------------------------------------
[sources]
# Allow only crates.io. Unknown registries and git sources are denied to
# prevent supply-chain attacks through private forks or unreviewed mirrors.
unknown-registry = "deny"
unknown-git      = "deny"

# Allowed git sources (empty by default; add entries only after security review).
# Format: { url = "https://github.com/owner/repo" }
allow-git = []
